name: pinact

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
      - mise.toml
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - mise.toml

permissions:
  contents: read

jobs:
  pinact:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      with:
        install_args: aqua:suzuki-shunsuke/pinact

    # --verify-comment also catches a version comment that does not match its
    # SHA, which a hand-edited or malicious change could introduce.
    - name: check actions are pinned
      run: pinact run --check --verify-comment
      env:
        GITHUB_TOKEN: ${{ github.token }}
